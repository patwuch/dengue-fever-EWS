# ============================================================
# OpenDengue SEA — XGBoost Regressor (multi-country)
# Invoke: snakemake <target> --configfile config/OpenDengue_xgboost_classifier.yaml
# ============================================================

name:    xgboostv1
dataset: opendengue
model:   xgboost
task:    regressor
scope:   multi-country
wandb_project: stgnn-dengue

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  path:          data/interim/machine-learning/SEA_dengue_env_monthly_2011-2018.csv
  time_column:   year_month
  unit_column:   adm_1_name
  region_column: adm_0_name
  split:
    strategy:     month
    test_months:  14
    val_fraction: 0.2

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target_column: IR

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  log_transform:  true
  deseasonalise:  true
  scale_target:   true
  add_lag_target: false
  lag_steps:      []

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  use_landuse: true
  quality_vars: ['data_quality']
  env_vars:
    - precipitation_sum
    - temperature_2m_mean
    - temperature_2m_max_mean
    - temperature_2m_min_mean
    - potential_evaporation_sum_mean
    - total_evaporation_sum_mean
    - evaporation_from_bare_soil_sum_mean
    - evaporation_from_open_water_surfaces_excluding_oceans_sum_mean
    - evaporation_from_the_top_of_canopy_sum_mean
    - evaporation_from_vegetation_transpiration_sum_mean
    - LST_Day_1km_mean
    - LST_Night_1km_mean
    - NDVI_mean
    - EVI_mean
  climate_vars:  []
  epidemic_vars: []
  land_use_vars:
    - LC_Type1_pct_class1
    - LC_Type1_pct_class2
    - LC_Type1_pct_class3
    - LC_Type1_pct_class4
    - LC_Type1_pct_class5
    - LC_Type1_pct_class6
    - LC_Type1_pct_class7
    - LC_Type1_pct_class8
    - LC_Type1_pct_class9
    - LC_Type1_pct_class10
    - LC_Type1_pct_class11
    - LC_Type1_pct_class12
    - LC_Type1_pct_class13
    - LC_Type1_pct_class14
    - LC_Type1_pct_class15
    - LC_Type1_pct_class16
    - LC_Type1_pct_class17

# ---------------------------------------------------------------------------
# Tuning
# ---------------------------------------------------------------------------
tune:
  n_trials: 40
  device:   cuda
  search_space:
    xgboost:
      learning_rate:    {type: log_uniform, low: 1.0e-4, high: 3.0e-1}
      max_depth:        {type: int,         low: 2,     high: 10}
      n_estimators:     {type: int,         low: 50,    high: 500}
      subsample:        {type: uniform,     low: 0.5,   high: 1.0}
      colsample_bytree: {type: uniform,     low: 0.5,   high: 1.0}
      min_child_weight: {type: int,         low: 1,     high: 20}
      gamma:            {type: log_uniform, low: 1.0e-2, high: 10.0}
      reg_alpha:        {type: log_uniform, low: 1.0e-3, high: 10.0}
      reg_lambda:       {type: log_uniform, low: 0.1,   high: 100.0}
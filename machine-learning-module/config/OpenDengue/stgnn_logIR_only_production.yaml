# ============================================================
# OpenDengue SEA — STGNN Production Model, IR-ONLY variant
#
# Production counterpart of stgnn_logIR_only.yaml: past incidence,
# data_quality flags and the sin/cos month encoding, trained on all of
# 2011-2018. Mirrors stgnn_logIR_production.yaml (IR + environment)
# minus the climate and land-use inputs. Like that model it needs recent
# incidence (site/data/incidence/recent_incidence.csv) to forecast, but
# no Earth Engine data.
#
# Invoke:
#   snakemake results/STGNN/production_logIR_only/inference_bundle \
#       --configfile config/OpenDengue/stgnn_logIR_only_production.yaml \
#       --cores 4 --resources gpu=1
# ============================================================

name:    production_logIR_only
dataset: opendengue
model:   stgnn
task:    regressor
scope:   multi-country
wandb_project: stgnn-dengue

# Reuse best hyperparameters from the logIR_only sweep (stgnn_logIR_only.yaml) — no new sweep.
best_params_source: logIR_only
# Must match window_size in results/STGNN/logIR_only/best_params.json (after re-sweeping). Required for runs
# without a shared filesystem (kubernetes + S3), where that file can't be read at DAG-build
# time; when unset, the rule reads it from local disk instead.
# window_size: <n>   # set once the logIR_only re-sweep has picked it (needed only for k8s + S3 runs)


# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  path:          data/interim/machine-learning/SEA_dengue_env_monthly_2011-2018.csv
  time_column:   year_month
  unit_column:   adm_1_name
  region_column: adm_0_name
  split:
    strategy:     month
    test_months:  0      # no holdout — all data used for training
    val_fraction: 0.2    # early-stopping slice; must exceed window_size months (0.2 × 96 = 19 > 12), as in cyclical_seasonal

# ---------------------------------------------------------------------------
# Target
# ---------------------------------------------------------------------------
target_column: IR

# ---------------------------------------------------------------------------
# Preprocessing  (must match logIR_only exactly)
# ---------------------------------------------------------------------------
preprocessing:
  incidence_input: true   # past incidence is a model input (mode 1)
  log_transform:  true
  deseasonalise:  false
  cyclical_month_features: true
  scale_target:   true
  add_lag_target: false
  lag_steps:      []

# ---------------------------------------------------------------------------
# Features  (must match logIR_only exactly)
# ---------------------------------------------------------------------------
features:
  use_landuse: false
  quality_vars: ['data_quality']
  env_vars: [month_sin, month_cos]
  climate_vars:  []
  epidemic_vars: []
  land_use_vars: []

# ---------------------------------------------------------------------------
# Tune block kept for preprocess window expansion — no new tuning is run.
# ---------------------------------------------------------------------------
tune:
  n_trials:     0
  metric:       masked_huber_loss
  device:       cuda
  num_epochs:   50
  patience:     15
  search_space:
    stgnn:
      learning_rate:   {type: log_uniform, low: 1.0e-4, high: 5.0e-1}
      batch_size:      {type: categorical, choices: [2, 4]}
      window_size:     {type: categorical, choices: [1, 3, 6, 12]}
      gat1_hidden:     {type: categorical, choices: [16, 32, 64]}
      gat1_heads:      {type: categorical, choices: [2, 4]}
      mlp_hidden:      {type: categorical, choices: [32, 64]}
      gat2_hidden:     {type: categorical, choices: [16, 32, 64]}
      gat2_heads:      {type: categorical, choices: [2, 4]}
      mlp_layers:      {type: categorical, choices: [1, 2]}
      dropout:         {type: categorical, choices: [0.0, 0.2, 0.4]}

# S3-compatible object store for Snakemake's default storage (Phase 3).
#
# SeaweedFS, not MinIO: it's what this cluster's Kubeflow already runs (same image tag, same
# hardened securityContext), so it's known to work here.
#
# Credentials are NOT in this file. Create them first:
#   kubectl -n dengue-ews create secret generic seaweedfs-s3-config --from-file=s3.json=<file>
#
# Reached at http://<NUC tailscale IP>:30900 by both the host-side Snakemake and the job pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: dengue-ews
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path   # a directory on the node's disk; size is not enforced
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: dengue-ews
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: the old pod must release it before the new one starts
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      # local-path data lives on one node's disk, so keep the pod on that node.
      nodeSelector:
        kubernetes.io/hostname: tmu-clhm-nuc15crhu5
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: ghcr.io/chrislusf/seaweedfs:4.34
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumePreallocate=false
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # Idles around 100Mi but spikes past 1Gi (OOMKilled 6x at a 1Gi limit). The cap
            # stays only so a runaway can't starve the control plane sharing this node.
            limits:
              memory: 4Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: dengue-ews
spec:
  type: NodePort
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
      nodePort: 30900

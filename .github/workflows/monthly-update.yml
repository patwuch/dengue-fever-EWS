name: Monthly site update

# Two inference modes (see README "Monthly inference"):
#   climate   — always runs; zonal stats + climate delta → risk index
#   incidence — runs only if site/data/incidence/recent_incidence.csv exists
#               and an incidence bundle has been published
#
# One-time setup:
#   secrets.GEE_SERVICE_ACCOUNT   Earth Engine service-account key JSON
#   release "inference-bundles"   (or vars.BUNDLE_RELEASE) with assets
#       inference_bundle_climate.tar.gz   (required)
#       inference_bundle_incidence.tar.gz (optional)
#       regions.parquet                   (unless vars.GEE_REGIONS_ASSET is set)
#   vars.GEE_REGIONS_ASSET        optional Earth Engine table asset of the regions

on:
  schedule:
    # 02:00 UTC on the 1st of each month
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Last input month (YYYY-MM). Blank = two months ago. The forecast is the month after.'
        required: false
        default: ''

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit predictions + push docs/
      issues: write     # open an issue when a scheduled run fails
    env:
      BUNDLE_RELEASE: ${{ vars.BUNDLE_RELEASE || 'inference-bundles' }}
      GEE_REGIONS_ASSET: ${{ vars.GEE_REGIONS_ASSET }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python environment ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # torch must be installed first with its own index; --index-url is
          # a global pip flag that would poison the index for all other packages
          # if mixed into a single pip install call.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install \
            jupyter \
            ipykernel \
            pyyaml \
            earthengine-api \
            geopandas \
            pandas \
            numpy \
            torch-geometric \
            plotly \
            pyarrow
          # Write QUARTO_PYTHON into the persistent env so every subsequent
          # step (including quarto-actions/setup) sees the correct interpreter.
          echo "QUARTO_PYTHON=$pythonLocation/bin/python3" >> $GITHUB_ENV

      # ── Model bundles (best_model.pt etc. are git-ignored) ───────────────
      - name: Download inference bundles
        run: |
          mkdir -p bundles
          gh release download "$BUNDLE_RELEASE" --dir bundles \
            --pattern 'inference_bundle_*.tar.gz' --pattern 'regions.parquet'
          for mode in climate incidence; do
            if [ -f "bundles/inference_bundle_${mode}.tar.gz" ]; then
              mkdir -p "bundles/${mode}"
              tar -xzf "bundles/inference_bundle_${mode}.tar.gz" -C "bundles/${mode}"
            fi
          done
          test -f bundles/climate/inference_bundle/bundle.json \
            || { echo "::error::inference_bundle_climate.tar.gz missing from release $BUNDLE_RELEASE"; exit 1; }

      - name: Resolve month and window
        run: |
          MONTH="${{ github.event.inputs.month }}"
          [ -z "$MONTH" ] && MONTH=$(date -u -d "$(date -u +%Y-%m-01) -2 month" +%Y-%m)
          WINDOW=$(python -c "import json,glob; print(max(json.load(open(p))['window_size'] for p in glob.glob('bundles/*/inference_bundle/best_params.json')))")
          echo "MONTH=$MONTH"   >> $GITHUB_ENV
          echo "WINDOW=$WINDOW" >> $GITHUB_ENV
          echo "Last input month $MONTH, window $WINDOW"

      # ── Step 1: Fetch zonal statistics from GEE (backfills the window) ───
      - name: Fetch monthly zonal statistics
        env:
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}
        run: |
          python site/scripts/fetch_zonal_stats.py \
            --month "$MONTH" --backfill "$WINDOW" --regions bundles/regions.parquet

      # ── Step 2: Mode 2 — climate-only risk index (delta-corrected) ────────
      - name: Run climate-mode inference
        run: |
          python site/scripts/run_inference.py --mode climate \
            --bundle bundles/climate/inference_bundle --last-month "$MONTH"

      # ── Step 3: Mode 1 — with recent incidence, when available ────────────
      - name: Run incidence-mode inference
        run: |
          if [ ! -f site/data/incidence/recent_incidence.csv ]; then
            echo "No site/data/incidence/recent_incidence.csv — skipping incidence mode."
          elif [ ! -f bundles/incidence/inference_bundle/bundle.json ]; then
            echo "::warning::Incidence CSV present but no incidence bundle in release $BUNDLE_RELEASE — skipping."
          else
            python site/scripts/run_inference.py --mode incidence \
              --bundle bundles/incidence/inference_bundle --last-month "$MONTH"
          fi

      # ── Step 4: Commit zonal stats + prediction archive to main ──────────
      # [skip ci] prevents deploy-on-push.yml from firing on this commit.
      - name: Commit prediction archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/zonal_stats site/data/predictions site/data/latest_*.json
          if ! git diff --cached --quiet; then
            TARGET=$(python -c "import json; print(json.load(open('site/data/latest_predictions.json'))['target_month'])")
            git commit -m "data: predictions for $TARGET [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # ── Step 5: Render Quarto site ────────────────────────────────────────
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        working-directory: site
        run: quarto render .

      # ── Step 6: Deploy to GitHub Pages ────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: false
          commit_message: "chore: monthly site update ${{ github.run_id }}"

      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        run: |
          gh issue create \
            --title "Monthly site update failed ($MONTH)" \
            --body "Scheduled run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
